services:
  web:
    build:
      context: .
    container_name: innoapp
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8080:8000"
    depends_on:
      innauthor_db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - POSTGRES_DB=innauthor_db
      - POSTGRES_USER=innauthor_user
      - POSTGRES_PASSWORD=innauthor_password
      - POSTGRES_HOST=innauthor_db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - fastprogs_network

  innauthor_db:
    image: postgres:15
    container_name: innauthor_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=innauthor_db
      - POSTGRES_USER=innauthor_user
      - POSTGRES_PASSWORD=innauthor_password
    expose:
      - 5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U innauthor_user -d innauthor_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fastprogs_network

  redis:
    image: redis:7-alpine
    container_name: innoauthor-redis
    ports:
      - "6379:6379"
    networks:
      - fastprogs_network

networks:
  fastprogs_network:
    driver: bridge

volumes:
  postgres_data:
