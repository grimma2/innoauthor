{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-warning">
                <div class="card-header bg-warning text-dark">
                    <h4><i class="fa fa-exclamation-triangle"></i> Жалоба на "{{ project.title }}"</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="form-group">
                            <label>Причина жалобы <span class="text-danger">*</span></label>
                            <textarea name="reason" class="form-control" rows="5" required placeholder="Подробно опишите проблему..."></textarea>
                        </div>
                        <div class="form-group">
                            <button type="submit" class="btn btn-warning btn-block">
                                <i class="fa fa-exclamation-triangle"></i> Отправить жалобу
                            </button>
                        </div>
                        <a href="{% url 'projects:project_detail' project.slug %}" class="btn btn-secondary btn-block">← Назад к проекту</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
